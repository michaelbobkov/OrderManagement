server:
  port: 8080
spring:
  application:
    name: order-service
notification:
  url: ${NOTIFICATION_URL:http://localhost:8000}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: order-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
